name: Link check

# The documentation rules already hold every repository path and symbol to a file that exists; nothing checks
# the links that point outside. A rotted link in a system page teaches an agent a wrong fact as surely as a
# rotted path, so lychee walks them once a week. It reports and never blocks: the web going down is not this
# repository's failure.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: External links in the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --exclude-path node_modules
            --exclude-path docs/atlas
            --exclude "^https?://localhost"
            --exclude "^https?://127\.0\.0\.1"
            --exclude "^https?://smartspend\.app"
            --exclude "^https?://assets\.smartspend\.ai"
            "**/*.md"
          output: lychee.md
          fail: false
      - name: Report
        if: always()
        run: cat lychee.md >> "$GITHUB_STEP_SUMMARY" || true
