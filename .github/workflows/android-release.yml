name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: Build Android Release (API 36, Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
            cat <<EOF > app/android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
          EOF
            echo "Keystore successfully configured."
          else
            echo "No keystore secret detected. Release build will use fallback configuration."
          fi

      - name: Build Android AppBundle (AAB)
        working-directory: mobile/app
        run: |
          flutter build appbundle --release \
            --dart-define=SMARTSPEND_ENV=production \
            --dart-define=SMARTSPEND_API_URL=https://api.smartspend.app

      - name: Build Split Release APKs
        working-directory: mobile/app
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SMARTSPEND_ENV=production \
            --dart-define=SMARTSPEND_API_URL=https://api.smartspend.app

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartspend-release-aab
          path: mobile/app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartspend-release-apks
          path: mobile/app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
