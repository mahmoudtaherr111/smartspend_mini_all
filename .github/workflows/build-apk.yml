name: Build Android APK

# The companion app only changes when its own files do. Building on every push to main
# committed a new 6 MB binary each time.
on:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً من موقع GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # A pinned Gradle: the Android plugin 8.2 does not run on Gradle 9, which a generated
      # wrapper would pick up from the runner.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Debug APK
        run: |
          cd android-app
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartspend-sync-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK to public/downloads
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/downloads/smartspend-sync.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/smartspend-sync.apk
          git commit -m "chore: update compiled android apk [skip ci]" || { echo "No changes to commit"; exit 0; }
          # main may have moved while the app was building.
          git pull --rebase origin main
          git push origin main
