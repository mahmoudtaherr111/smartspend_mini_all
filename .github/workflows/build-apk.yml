name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً من موقع GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Generate Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android-app
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartspend-sync-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK to public/downloads
        run: |
          mkdir -p public/downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk public/downloads/smartspend-sync.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/smartspend-sync.apk
          git commit -m "chore: update compiled android apk [skip ci]" || echo "No changes to commit"
          git push origin main
