name: CI — SmartSpend AI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b

  knowledge:
    name: Knowledge (atlas, architecture model and rules match the code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/architecture/package-lock.json
      - run: npm ci
      - run: npm run atlas:check
      # Docs, flows and architecture rules. Runs on its own so it gates even while the full suite is red.
      - run: npx vitest run tests/knowledge
      - run: npm run arch:install
      - run: npm run arch:validate

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
        env:
          DATABASE_URL: "mysql://test:test@localhost:3306/test"
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          JWT_SECRET: test-secret-for-ci
          GEMINI_API_KEY: test
          NODE_ENV: test
          TRUST_PROXY: "true"
          REDIS_URL: ""

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run npm dependency audit (Fail on High or Critical)
        run: npm audit --audit-level=high

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          DATABASE_URL: "mysql://test:test@localhost:3306/test"
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          JWT_SECRET: test-secret-for-ci
          GEMINI_API_KEY: test
          NODE_ENV: test
          CI: "true"
