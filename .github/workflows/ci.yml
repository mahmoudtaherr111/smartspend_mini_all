name: CI — SmartSpend AI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b

  knowledge:
    name: Knowledge (atlas, architecture model and rules match the code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # LikeC4 needs Node 22.22.3 or newer; the runner's cached 22.x can be older.
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/architecture/package-lock.json
      - run: npm ci
      - name: Generated knowledge matches the code
        # On main, the knowledge autofix workflow regenerates a stale atlas instead of failing.
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run atlas:check
      # Docs, flows and architecture rules. Runs on its own so it gates even while the full suite is red.
      - run: npx vitest run tests/knowledge
      - run: npm run arch:install
      - run: npm run arch:validate

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
        env:
          DATABASE_URL: "mysql://test:test@localhost:3306/test"
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          JWT_SECRET: test-secret-for-ci
          GEMINI_API_KEY: test
          NODE_ENV: test
          TRUST_PROXY: "true"
          REDIS_URL: ""

  integration-tests:
    name: Integration tests (MySQL and Redis)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: smartspend_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: "mysql://root:test@127.0.0.1:3306/smartspend_test"
      REDIS_URL: "redis://127.0.0.1:6379"
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      JWT_SECRET: test-secret-for-ci
      GEMINI_API_KEY: test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the schema from db/schema.ts
        run: npx drizzle-kit push --force
      - run: npm run test:db
      - run: npm run test:redis

  build:
    name: Production build and build-output checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:build
        env:
          DATABASE_URL: "mysql://test:test@localhost:3306/test"
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          JWT_SECRET: test-secret-for-ci
          GEMINI_API_KEY: test
          NODE_ENV: test

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run npm dependency audit (Fail on High or Critical)
        run: npm audit --audit-level=high

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite's iPhone and iPad projects are WebKit devices (playwright.config.ts),
      # so a chromium-only install could never launch three of the four projects.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          DATABASE_URL: "mysql://test:test@localhost:3306/test"
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          JWT_SECRET: test-secret-for-ci
          GEMINI_API_KEY: test
          NODE_ENV: test
          CI: "true"
