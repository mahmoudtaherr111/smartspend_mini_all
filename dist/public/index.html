          letter-spacing: -0.02em;

      <script>
        // Never leave a slow network or a failed bundle looking like a frozen
        // splash screen. React normally dismisses this much sooner.
        window.setTimeout(function () {
          var loader = document.querySelector(".app-loader");
          if (!loader) return;
          loader.style.transition = "opacity 0.16s ease-out";
          loader.style.opacity = "0";
          window.setTimeout(function () {
            loader.remove();
          }, 180);
        }, 1200);
