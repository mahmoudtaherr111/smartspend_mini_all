          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100dvh;

          animation: app-spin 1s linear infinite;
          margin-bottom: 16px;

        @keyframes app-spin { to { transform: rotate(360deg); } }
        .app-loader-text {
          font-size: 1.2rem;
          font-weight: 700;
          color: #10b981;
          animation: app-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes app-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div class="app-loader" aria-hidden="true">
