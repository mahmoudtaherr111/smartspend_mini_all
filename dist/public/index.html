<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SmartSpend AI | مصاريفك بالذكاء الاصطناعي</title>
    <meta name="description" content="تتبع مصاريفك بصوتك عبر الذكاء الاصطناعي" />
    <meta name="theme-color" content="#10b981" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script type="module" crossorigin src="/assets/index-CMoGz4Rf.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CQHY4ENe.css">
  </head>
  <body>
    <div id="root">
      <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        .app-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: #0f172a;
          color: white;
          font-family: system-ui, -apple-system, sans-serif;
        }
        @media (prefers-color-scheme: light) {
          .app-loader {
            background: #f8fafc;
          }
        }
        .app-loader-spinner {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(16, 185, 129, 0.2);
          border-top-color: #10b981;
          border-radius: 50%;
          animation: app-spin 1s linear infinite;
          margin-bottom: 16px;
        }
        @keyframes app-spin {
          to { transform: rotate(360deg); }
        }
        .app-loader-text {
          font-size: 1.2rem;
          font-weight: 700;
          color: #10b981;
          animation: app-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes app-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div class="app-loader">
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">SmartSpend</div>
      </div>
    </div>
    <div style="display:none">HTML_LOADED_SUCCESSFULLY</div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
