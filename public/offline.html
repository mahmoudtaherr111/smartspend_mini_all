<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <title>SmartSpend — غير متصل</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 1rem;
        padding: 1.5rem;
        background: rgba(15,23,42,0.9);
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #10b981; }
      p { font-size: 0.9rem; line-height: 1.6; opacity: 0.85; margin: 0 0 1rem; }
      button {
        width: 100%;
        min-height: 48px;
        border: none;
        border-radius: 0.75rem;
        background: #10b981;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>أنت غير متصل</h1>
      <p>تحقق من الإنترنت ثم أعد المحاولة. البيانات المحفوظة محلياً ستظهر عند العودة للتطبيق.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
