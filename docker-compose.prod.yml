name: smartspend-prod

services:
  mysql:
    image: mysql:8.4
    container_name: smartspend-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=3G
      - --innodb-log-buffer-size=64M
      - --innodb-redo-log-capacity=1G
      - --max-connections=200
      - --slow-query-log=1
      - --long-query-time=0.1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartspend}
      MYSQL_USER: ${MYSQL_USER:-smartspend}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
    ports:
      # Bound strictly to loopback interface for local administrative and backup access
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=socket --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: smartspend-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 1gb
      # Redis also holds one-time codes, sessions and counters: only keys with an expiry may be evicted.
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    ports:
      # Bound strictly to loopback interface
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    image: smartspend-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartspend-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://${MYSQL_USER:-smartspend}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smartspend}
      REDIS_URL: redis://redis:6379
      ENABLE_CRONS: "true"
      TRUST_PROXY: "true"
      TRUSTED_PROXY_IPS: "127.0.0.1,172.16.0.0/12,10.0.0.0/8"
      TRUSTED_PROXY_HEADER: "x-forwarded-for"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    ports:
      # Bound strictly to loopback interface; public traffic flows through Nginx reverse-proxy
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    image: nginx:1.27-alpine
    container_name: smartspend-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend-network

  certbot:
    image: certbot/certbot:latest
    container_name: smartspend-certbot
    restart: "no"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

networks:
  backend-network:
    internal: true
  frontend-network:
    internal: false

volumes:
  mysql_data:
  redis_data:
  certbot_conf:
  certbot_www:
