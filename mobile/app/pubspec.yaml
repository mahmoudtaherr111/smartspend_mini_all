name: smartspend_app
description: "SmartSpend AI for Android and iOS."
publish_to: none
resolution: workspace

# version is the store version (Android versionName, iOS CFBundleShortVersionString); the number after + is the
# build number (versionCode, CFBundleVersion). `flutter build --build-name/--build-number` override both.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  bank_capture:
    path: ../packages/bank_capture
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  intl: ^0.20.3
  smartspend_api:
    path: ../packages/smartspend_api
  smartspend_ui:
    path: ../packages/smartspend_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Builds lib/src/l10n/app_localizations*.dart from the .arb files (l10n.yaml).
  generate: true
